<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1200px;height:630px;background:#f7f3ea;
       font-family:"PingFang SC","Hiragino Sans GB",sans-serif;color:#221e18;
       display:flex;align-items:center;padding:0 80px;gap:70px;}
  .l{flex:1;}
  .kicker{font-size:15px;letter-spacing:.42em;color:#7a7263;font-weight:600;margin-bottom:20px;}
  h1{font-family:"Songti SC","STSong",serif;font-weight:900;font-size:88px;
     letter-spacing:.1em;line-height:1.15;}
  h1 em{font-style:normal;color:#bf3a26;}
  .tag{font-size:23px;color:#4a443a;margin-top:22px;line-height:1.65;font-weight:500;}
  .tag b{color:#221e18;font-weight:700;}
  .q{margin-top:30px;font-family:"Songti SC",serif;font-weight:900;font-size:19px;
     letter-spacing:.05em;color:#7a7263;}
  .badge{width:280px;height:280px;background:#a8722a;border-radius:44px;
         display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .badge span{font-family:"Songti SC",serif;font-weight:900;font-size:170px;color:#f7f3ea;}
  .badge i{position:absolute;font-style:normal;}
</style>
</head>
<body>
  <div class="l">
    <div class="kicker">PICKLEBALL · 礼仪与规则</div>
    <h1>先礼后<em>兵</em></h1>
    <div class="tag">年度修订雷达 + 易误解规则澄清卡<br>+ 球场不成文法 · <b>中国本地化</b></div>
    <div class="q">规则印在手册里，规矩长在场地上</div>
  </div>
  <div class="badge"><span>礼</span></div>
</body>
</html>
